name: reference-and-native-checks
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - run: cargo +1.99.0 fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo +1.99.0 test --manifest-path rust/Cargo.toml --locked
      - run: cargo +1.99.0 build --manifest-path rust/Cargo.toml --locked
      - run: sudo apt-get update && sudo apt-get install -y regina-rexx
      - run: |
          if rexx rexx/david.rexx demo > license-denial.txt; then exit 1; fi
          grep -Eq 'LICENSE_ISSUER_UNCONFIGURED|LICENSE_ENTITLEMENT_MISSING' license-denial.txt
      - run: rexx rexx/david.rexx fmt
      - run: |
          rexx rexx/david.rexx version | tee version.txt
          grep -q '"version": "0.2.0"' version.txt
          rust/target/debug/david license-status | tee native-license.txt
          grep -Eq 'LICENSE_ISSUER_UNCONFIGURED|LICENSE_ENTITLEMENT_MISSING' native-license.txt
          if rust/target/debug/david run examples/cobol-inspect.json examples/cobol-principal.json "$RUNNER_TEMP/david-workflow.sqlite" > native-denial.txt; then exit 1; fi
          grep -Eq 'LICENSE_ISSUER_UNCONFIGURED|LICENSE_ENTITLEMENT_MISSING' native-denial.txt
          rust/target/debug/david audit "$RUNNER_TEMP/david-workflow.sqlite" | tee native-audit.txt
          grep -q '"count": 0' native-audit.txt
      - run: |
          if rexx rexx/david.rexx arbitrary-command; then exit 1; fi
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y gnucobol swi-prolog
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 test --manifest-path rust/Cargo.toml --locked -p david-control-plane native_broker_roundtrip -- --ignored --nocapture
      - run: mkdir -p build
      - run: cobc -std=cobol85 -fixed -I cobol/copybooks -x -o build/smoke cobol/smoke.cbl cobol/synthetic-david-corp.cbl
      - run: build/smoke | tee build/smoke.log
      - run: |
          grep -qx 'PASS: MISSING ID AND MISSING BROKER FAIL CLOSED' build/smoke.log
      - run: swipl -q -s policy/policy_tests.pl -g run_tests -t halt
