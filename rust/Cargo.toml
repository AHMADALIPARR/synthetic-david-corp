[workspace]
members = ["qwen-endpoint", "control-plane", "execution-gate", "cloudflare-finops"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tiny_http = "0.12"
